# CEQ Kubernetes Kustomization
#
# Deploy all CEQ resources with:
#   kubectl apply -k infrastructure/k8s/
#
# In production, ArgoCD's `ceq-services` application reconciles this
# kustomization. CI commits image digests below via
# `kustomize edit set image` after each successful build.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ceq

# Common labels applied to all resource metadata — but NOT selectors.
#
# The previous `commonLabels:` form silently propagated into Service
# spec.selector AND Deployment spec.selector.matchLabels, but pods
# inherit their labels from the Deployment template which carries
# different values (`app.kubernetes.io/name=ceq-studio` /
# `part-of=ceq`). Result: Service selector required 4 labels, pods
# only had 3 with conflicting values → endpoints empty → all of
# ceq.lol returned 502 from cloudflared for ~7 hours on 2026-05-04
# until live-patched + this source fix.
#
# `labels:` with `includeSelectors: false` is the kustomize-
# recommended replacement: still tags every resource's metadata.labels
# for grouping in dashboards, but leaves selectors alone so they keep
# matching whatever the Deployment template actually emits.
labels:
- pairs:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: ceq
    app.kubernetes.io/part-of: madfam-platform

# Resources to include
# PreSync hook job — runs alembic upgrade head before deployments roll.
  # secrets.yaml is a local template only (never commit secrets). Apply your
  # real secret manifest separately as `secrets.local.yaml` (gitignored) or via
  # external-secrets tooling before ArgoCD applies this bundle.
  # cloudflared removed 2026-04-25: ceq-prod tunnel deleted on Cloudflare side
  # 2026-04-09; ceq.lol / api.ceq.lol / ws.ceq.lol DNS now routes through the
  # main enclii-prod tunnel at the platform level. No per-namespace cloudflared
  # needed. Old config + leaked token (R1 audit) removed in this commit.
  # - cloudflared.yaml
  # seed-templates-job.yaml is intentionally excluded — manual one-shot only.
# Kyverno exception for the bounded one-shot Jobs (migration + seed), which
# cannot carry meaningful readiness probes. See policy-exceptions.yaml.
resources:
- namespace.yaml
- api-deployment.yaml
- studio-deployment.yaml
- worker-deployment.yaml
- worker-orchestrator-deployment.yaml
- db-migrate-job.yaml
- ceq-kubernetes-secretstore.yaml
- external-secret.yaml
- network-policies.yaml
- observability.yaml
- policy-exceptions.yaml

# Image customization. CI's deploy.yaml workflow rewrites these entries
# via `kustomize edit set image <name>=<name>@sha256:...` on every build,
# pinning each Deployment + the migration Job to a content-addressed
# digest. ArgoCD's `ceq-services` application reconciles the change
# within ~3 min.
#
# 2026-05-14 — API, Studio, and Worker are pinned by digest through the
# CEQ Deploy GitOps workflow. Run 25850545748 produced deploy commit
# 44f2e0b, the first deploy commit after worker digest gating, and
# confirmed dash-form GHCR images exist for all three services.
#
# Keep `name` and `newName` in dash-form. Deployment manifests reference
# `ghcr.io/madfam-org/ceq-{api,studio,worker}:latest`; kustomize rewrites
# those mutable references to the immutable digest entries below.
#
# WHY `:latest` STAYS IN THE BASE MANIFESTS (verified 2026-08-24):
# Kyverno's `disallow-latest-tag` and `require-image-digest` both match
# `kind: Pod` — they evaluate the RENDERED image, after kustomize applies the
# digests below, not the literal text of the Deployment files. Rendering this
# bundle yields 5/5 containers as `@sha256:...` and 0 `:latest`, so both
# policies already pass. The `:latest` strings here are placeholder join-keys
# for `kustomize edit set image`, never what the cluster pulls.
#
# Do NOT "fix" this by hardcoding a digest into the Deployment files. Kustomize
# would still override it (tested), so the hardcoded value would be dead but
# authoritative-looking config: a second place digests appear that the GitOps
# workflow never updates, guaranteed to drift from the real pin below.
# `apps/api/tests/test_k8s_manifests.py::test_rendered_manifests_*` pins the
# rendered-output invariant so this cannot regress silently.
images:
- digest: sha256:e54200b65bc084b5d2ee22a91390bd385bbbbc3eee17e377c2d2ea38ad9c0edd
  name: ghcr.io/madfam-org/ceq-api
  newName: ghcr.io/madfam-org/ceq-api
- digest: sha256:058bee402c746985b7cae5baeb0e970200226eb1239fea3282fd2ad8f64bf187
  name: ghcr.io/madfam-org/ceq-studio
  newName: ghcr.io/madfam-org/ceq-studio
- digest: sha256:e101c8f2dd032cfa80183f6d343d1b1de72a4fdfad7df467df380402d988bf9a
  name: ghcr.io/madfam-org/ceq-worker
  newName: ghcr.io/madfam-org/ceq-worker

# ConfigMap generator for environment-specific values
configMapGenerator:
- literals:
  - ENVIRONMENT=production
  - LOG_LEVEL=info
  - METRICS_ENABLED=true
  name: ceq-runtime-config
