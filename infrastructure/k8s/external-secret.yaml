---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ceq-secrets
  namespace: ceq
  labels:
    app: ceq
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: ceq-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      # Merge: templated keys below override/add to the data[]-fetched keys;
      # everything else renders exactly as fetched from Vault.
      mergePolicy: Merge
      data:
        # pgbouncer adoption (move 2): the RUNTIME URL routes through the
        # transaction pooler; Vault keeps holding the direct URL, which also
        # feeds DIRECT_DATABASE_URL below so the ArgoCD PreSync migrate Job
        # and alembic stay on a direct 5432 session. Flip and rollback are
        # both one revert of this template — Vault is never edited.
        #
        # The host rewrite is host-only and does NOT normalize the rest of the
        # URL: whatever query string Vault holds (e.g. `?sslmode=require`) is
        # carried through verbatim onto the pooled URL. asyncpg forwards
        # unknown URL query params into connect() as kwargs, so such a param
        # is a hard connect failure for the runtime. `regexReplaceAll` anchors
        # on the host so a Vault value in ANY namespace (data/foundry/...) or
        # with the port omitted still flips exactly once — the previous plain
        # `replace` silently no-op'd on any other spelling. The application
        # additionally strips pooler-unsafe params at engine construction
        # (apps/api/src/ceq_api/db/url.py) so neither layer alone can outage us.
        #
        # ARGUMENT ORDER IS LOAD-BEARING — do NOT turn this into a `|` pipeline.
        # sprig's signature is `regexReplaceAll <regex> <s> <repl>`, and Go
        # templates append the piped value as the LAST argument. So
        #   {{ .DATABASE_URL | regexReplaceAll "<regex>" "<repl>" }}
        # binds s="<repl>" and repl=.DATABASE_URL: the regex never matches the
        # literal replacement string, so the whole render collapses to the bare
        # host fragment `@pgbouncer.data.svc.cluster.local:6432` — no scheme, no
        # credentials, no database name. That is exactly what shipped in #73 on
        # 2026-08-24 and it took production down on 2026-09-05: every ceq-api
        # pod in the new ReplicaSet crash-looped with
        #   sqlalchemy.exc.ArgumentError: Could not parse SQLAlchemy URL ...
        # (1254 restarts by 09-09) while the PreSync migrate Job stayed green
        # because alembic reads DIRECT_DATABASE_URL, which is untemplated.
        # `.DATABASE_URL` therefore stays in the explicit 2nd (`s`) position.
        # `tests/test_k8s_manifests.py::test_external_secret_database_url_*`
        # renders this template for real so the shape cannot regress again.
        DATABASE_URL: '{{ regexReplaceAll "@postgres[.][a-z0-9-]+[.]svc[.]cluster[.]local(:[0-9]+)?" .DATABASE_URL "@pgbouncer.data.svc.cluster.local:6432" }}'
        DIRECT_DATABASE_URL: '{{ .DATABASE_URL }}'
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: secret/ceq
        property: DATABASE_URL
    - secretKey: REDIS_URL
      remoteRef:
        key: secret/ceq
        property: REDIS_URL
    - secretKey: REDIS_PASSWORD
      remoteRef:
        key: secret/ceq
        property: REDIS_PASSWORD
    - secretKey: R2_ENDPOINT
      remoteRef:
        key: secret/ceq
        property: R2_ENDPOINT
    - secretKey: R2_ACCESS_KEY
      remoteRef:
        key: secret/ceq
        property: R2_ACCESS_KEY
    - secretKey: R2_SECRET_KEY
      remoteRef:
        key: secret/ceq
        property: R2_SECRET_KEY
    - secretKey: R2_BUCKET_NAME
      remoteRef:
        key: secret/ceq
        property: R2_BUCKET_NAME
    - secretKey: JOB_COMPLETION_CALLBACK_TOKEN
      remoteRef:
        key: secret/ceq
        property: JOB_COMPLETION_CALLBACK_TOKEN
    - secretKey: JOB_WEBHOOK_SECRET
      remoteRef:
        key: secret/ceq
        property: JOB_WEBHOOK_SECRET
    - secretKey: FURNACE_API_KEY
      remoteRef:
        key: secret/ceq
        property: FURNACE_API_KEY
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ceq-orchestrator-secrets
  namespace: ceq
  labels:
    app: ceq-orchestrator
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: vault-store
    kind: ClusterSecretStore
  target:
    name: ceq-orchestrator-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: VAST_API_KEY
      remoteRef:
        key: secret/ceq
        property: vast_api_key
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: ceq-janua-client-secret
  namespace: ceq
  labels:
    app: ceq
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: ceq-kubernetes-store
    kind: ClusterSecretStore
  target:
    name: ceq-janua-client-secret
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: JANUA_CLIENT_SECRET
      remoteRef:
        key: ceq-janua-client-secret-source
        property: JANUA_CLIENT_SECRET
---
