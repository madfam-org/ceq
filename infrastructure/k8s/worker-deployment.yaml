apiVersion: apps/v1
kind: Deployment
metadata:
  name: ceq-worker
  namespace: ceq
  labels:
    app: ceq-worker
  annotations:
    ceq.madfam.io/compute-strategy: "in-cluster-keda-blocked"
    ceq.madfam.io/blocker: "no-gpu-nodes-on-hetzner-cluster"
    ceq.madfam.io/production-path: "ceq-orchestrator + vast.ai — see docs/GPU_COMPUTE_STRATEGY.md"
spec:
  # In-cluster GPU workers: blocked until Hetzner GPU node + nvidia device plugin.
  # Production GPU path today is ceq-orchestrator → Vast.ai (worker-orchestrator-deployment.yaml).
  replicas: 0
  selector:
    matchLabels:
      app: ceq-worker
  template:
    metadata:
      labels:
        app: ceq-worker
    spec:
      # Schedule on GPU nodes only
      nodeSelector:
        node.kubernetes.io/gpu: "true"
      tolerations:
        - key: nvidia.com/gpu
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      imagePullSecrets:
        - name: ghcr-credentials
      containers:
        - name: ceq-worker
          image: ghcr.io/madfam-org/ceq-worker:latest
          ports: []
          env:
            - name: WORKER_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: ceq-secrets
                  key: REDIS_URL
            - name: API_URL
              value: "http://ceq-api.ceq.svc.cluster.local"
            - name: API_JOB_COMPLETION_TOKEN
              valueFrom:
                secretKeyRef:
                  name: ceq-secrets
                  key: JOB_COMPLETION_CALLBACK_TOKEN
            - name: API_JOB_COMPLETION_MAX_ATTEMPTS
              value: "3"
            - name: API_JOB_COMPLETION_RETRY_BACKOFF_SECONDS
              value: "1"
            - name: JOB_COMPLETION_DEAD_LETTER_KEY
              value: "ceq:jobs:completion:dead"
            - name: R2_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: ceq-secrets
                  key: R2_ENDPOINT
            - name: R2_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: ceq-secrets
                  key: R2_ACCESS_KEY
            - name: R2_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: ceq-secrets
                  key: R2_SECRET_KEY
            - name: R2_BUCKET_NAME
              valueFrom:
                secretKeyRef:
                  name: ceq-secrets
                  key: R2_BUCKET_NAME
            - name: COMFYUI_PATH
              value: /opt/comfyui
            - name: MODELS_PATH
              value: /opt/models
            - name: OUTPUTS_PATH
              value: /opt/outputs
          resources:
            requests:
              memory: "16Gi"
              cpu: "4"
              nvidia.com/gpu: "1"
            limits:
              memory: "32Gi"
              cpu: "8"
              nvidia.com/gpu: "1"
          securityContext:
            privileged: false
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          # Probes are required by Kyverno `require-probes` even at replicas: 0.
          # That policy is validationFailureAction: Audit, so a probe-less
          # template was reported, never blocked — which is exactly why this
          # gap survived: it produced report noise instead of a failed sync.
          # The gap is still real. `require-probes` matches `kind: Pod` and
          # excludes only namespaces labelled enclii.dev/type in
          # [infrastructure, build, data]; `ceq` is `application`, so every pod
          # this template ever creates is evaluated — and the cluster's
          # Enforce-mode `require-health-probes` demands httpGet on Deployments
          # for any namespace lacking that label. Scaling this workload without
          # probes is a latent failure, not a cosmetic one.
          #
          # This container runs `python -m ceq_worker.queue`: a headless Redis
          # DB-14 queue consumer with NO HTTP listener (Dockerfile CMD; note
          # the explicit `ports: []` above). An httpGet probe would therefore
          # fail permanently. The exec Redis PING mirrors the pattern already
          # proven on ceq-orchestrator (worker-orchestrator-deployment.yaml),
          # and matches what the consumer itself does on startup
          # (QueueConsumer.initialize -> redis.from_url(REDIS_URL)): if Redis
          # is unreachable the worker cannot claim jobs, so "can reach Redis"
          # is the honest definition of ready for this workload.
          #
          # `redis` is a first-party dependency of the worker image
          # (apps/workers/pyproject.toml: redis>=5.0.0), so the probe needs no
          # extra tooling in the container.
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import redis; import os; redis.from_url(os.environ['REDIS_URL']).ping()"
            # GPU workers pull large models on cold start; keep the liveness
            # window wide so a slow warm-up is never mistaken for a hang.
            initialDelaySeconds: 30
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import redis; import os; redis.from_url(os.environ['REDIS_URL']).ping()"
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          volumeMounts:
            - name: models
              mountPath: /opt/models
            - name: outputs
              mountPath: /opt/outputs
            - name: cache
              mountPath: /opt/cache
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: ceq-models-pvc
        - name: outputs
          emptyDir: {}
        - name: cache
          emptyDir: {}
---
# KEDA ScaledObject for autoscaling GPU workers
apiVersion: keda.sh/v1alpha1
kind: TriggerAuthentication
metadata:
  name: ceq-redis-auth
  namespace: ceq
spec:
  secretTargetRef:
    - parameter: password
      name: ceq-secrets
      key: REDIS_PASSWORD
---
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: ceq-worker-scaler
  namespace: ceq
spec:
  scaleTargetRef:
    name: ceq-worker
  pollingInterval: 10
  cooldownPeriod: 300
  minReplicaCount: 0
  maxReplicaCount: 4
  triggers:
    - type: redis
      metadata:
        address: redis.data.svc.cluster.local:6379
        databaseIndex: "14"
        listName: ceq:jobs:pending
        listLength: "1"
      authenticationRef:
        name: ceq-redis-auth
